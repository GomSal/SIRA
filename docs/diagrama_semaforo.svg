<svg xmlns="http://www.w3.org/2000/svg" width="680" height="862" viewBox="0 0 680 862" role="img">
<title>Flujo del semáforo de humedad SIRA</title>
<desc>El modelo A detecta la siembra y da el NDVI. Con clima observado y riego supuesto CD, las ecuaciones S y Dr arman las entradas del modelo B (ARIMAX), que corrige la humedad de hoy con lo aprendido en Nataima. De ahí sale el déficit de arranque, que la ecuación Dr de FAO-56 propaga 30 días con GEOS-S2S y el NDVI pronosticado por A, y termina en el semáforo por pixel.</desc>
<style>
text{font-family:"Segoe UI",Helvetica,Arial,sans-serif;dominant-baseline:central;text-anchor:middle}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.l{text-anchor:start}
.box{fill:#FFFFFF;stroke:#B4B2A9;stroke-width:.8}
.pu rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.8}.pu .th{fill:#3C3489}.pu .ts{fill:#534AB7}
.te rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.8}.te .th{fill:#085041}.te .ts{fill:#0F6E56}
.co rect{fill:#FAECE7;stroke:#993C1D;stroke-width:.8}.co .th{fill:#712B13}.co .ts{fill:#993C1D}
.re rect{fill:#FCEBEB;stroke:#A32D2D;stroke-width:.8}.re .th{fill:#791F1F}.re .ts{fill:#A32D2D}
.am rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:.8}.am .th{fill:#633806}.am .ts{fill:#854F0B}
.gr rect{fill:#EAF3DE;stroke:#3B6D11;stroke-width:.8}.gr .th{fill:#27500A}.gr .ts{fill:#3B6D11}
.pk rect{fill:#FBEAF0;stroke:#993556;stroke-width:.8}.pk .th{fill:#72243E}.pk .ts{fill:#993556}
.a{stroke:#5F5E5A;stroke-width:1.2;fill:none}.ap{stroke:#7F77DD;stroke-width:1.5;fill:none}
.cont{fill:none;stroke:#888780;stroke-width:.8;stroke-dasharray:4 4}
</style>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="680" height="862" fill="#FFFFFF"/>
<rect class="box" x="40" y="40" width="180" height="56" rx="8"/><text class="th" x="130" y="58">Imágenes satelitales</text><text class="ts" x="130" y="78">Sentinel-2 + Landsat</text>
<line class="a" x1="220" y1="68" x2="278" y2="68" marker-end="url(#ag)"/>
<g class="pu"><rect x="280" y="40" width="360" height="56" rx="8"/><text class="th" x="460" y="58">Modelo A · predictor (Random Forest)</text><text class="ts" x="460" y="78">Detecta la siembra · NDVI y NDMI hasta +30 días</text></g>
<rect class="cont" x="30" y="118" width="620" height="274" rx="12"/>
<text class="th l" x="46" y="138">De la siembra a hoy</text>
<line class="ap" x1="460" y1="96" x2="460" y2="154" marker-end="url(#ap)"/>
<rect class="box" x="40" y="152" width="180" height="56" rx="8"/><text class="th" x="130" y="170">Clima observado</text><text class="ts" x="130" y="190">CHIRPS + NASA POWER</text>
<line class="a" x1="220" y1="180" x2="278" y2="180" marker-end="url(#ag)"/>
<rect class="box" x="40" y="222" width="180" height="56" rx="8"/><text class="th" x="130" y="240">Riego supuesto CD</text><text class="ts" x="130" y="260">Calendarios de Nataima</text>
<line class="a" x1="220" y1="250" x2="278" y2="250" marker-end="url(#ag)"/>
<g class="te"><rect x="280" y="156" width="360" height="134" rx="8"/><text class="th" x="460" y="180">Ecuaciones de entrada a B</text><text class="ts" x="460" y="208">S₂₀ y S₅: reservorio (τ = 20 y 5 días)</text><text class="ts" x="460" y="230">Dr: déficit FAO-56 (k = 0,5)</text><text class="ts" x="460" y="252">Kc = 1,0·NDVI + 0,45</text><text class="ts" x="460" y="272">+ riego 5 d, días sin riego, ETo 5 d</text></g>
<line class="a" x1="460" y1="290" x2="460" y2="316" marker-end="url(#ag)"/>
<rect class="box" x="40" y="318" width="180" height="56" rx="8"/><text class="th" x="130" y="336">TDR de Nataima</text><text class="ts" x="130" y="356">198 mediciones</text>
<line class="a" x1="220" y1="346" x2="278" y2="346" stroke-dasharray="4 3" marker-end="url(#ag)"/>
<g class="pu"><rect x="280" y="318" width="360" height="56" rx="8"/><text class="th" x="460" y="336">Modelo B · corrector (ARIMAX)</text><text class="ts" x="460" y="356">7 entradas → μ₀, humedad de hoy (% TDR)</text></g>
<line class="a" x1="460" y1="374" x2="460" y2="414" marker-end="url(#ag)"/>
<g class="co"><rect x="280" y="416" width="360" height="56" rx="8"/><text class="th" x="460" y="434">Hoy: déficit de arranque Dr₀</text><text class="ts" x="460" y="454">1,5·(30 − μ₀) + margen 4,7 mm</text></g>
<rect class="cont" x="30" y="492" width="620" height="120" rx="12"/>
<text class="th l" x="46" y="512">De hoy a +30 días, sin riego</text>
<line class="a" x1="460" y1="472" x2="460" y2="522" marker-end="url(#ag)"/>
<rect class="box" x="40" y="532" width="180" height="56" rx="8"/><text class="th" x="130" y="550">GEOS-S2S</text><text class="ts" x="130" y="570">Lluvia y ETo, 5 miembros</text>
<line class="a" x1="220" y1="560" x2="278" y2="560" marker-end="url(#ag)"/>
<g class="te"><rect x="280" y="524" width="360" height="72" rx="8"/><text class="th" x="460" y="544">Dr FAO-56 propaga</text><text class="ts" x="460" y="566">Dr(t) = Dr(t−1) − lluvia + Ks·Kc·ETo</text><text class="ts" x="460" y="584">Kc con el NDVI pronosticado por A</text></g>
<path class="ap" d="M640 68 L660 68 L660 686 L642 686" marker-end="url(#ap)"/>
<path class="ap" d="M660 560 L642 560" marker-end="url(#ap)"/>
<path class="a" d="M460 596 L460 636 L107 636"/>
<line class="a" x1="107" y1="636" x2="107" y2="656" marker-end="url(#ag)"/>
<line class="a" x1="262" y1="636" x2="262" y2="656" marker-end="url(#ag)"/>
<line class="a" x1="417" y1="636" x2="417" y2="656" marker-end="url(#ag)"/>
<g class="re"><rect x="40" y="658" width="135" height="56" rx="8"/><text class="th" x="107" y="676">Rojo: regar ya</text><text class="ts" x="107" y="696">Dr &gt; 4,34 mm</text></g>
<g class="am"><rect x="195" y="658" width="135" height="56" rx="8"/><text class="th" x="262" y="676">Amarillo: pronto</text><text class="ts" x="262" y="696">0 a 4,34 mm</text></g>
<g class="gr"><rect x="350" y="658" width="135" height="56" rx="8"/><text class="th" x="417" y="676">Verde: no regar</text><text class="ts" x="417" y="696">Dr ≤ 0</text></g>
<g class="pk"><rect x="505" y="658" width="135" height="56" rx="8"/><text class="th" x="572" y="676">Alarma NDMI</text><text class="ts" x="572" y="696">Posible enfermedad</text></g>
<path class="a" d="M107 714 L107 738 L572 738 L572 714"/>
<line class="a" x1="262" y1="714" x2="262" y2="738"/>
<line class="a" x1="417" y1="714" x2="417" y2="738"/>
<line class="a" x1="340" y1="738" x2="340" y2="764" marker-end="url(#ag)"/>
<rect class="box" x="180" y="766" width="320" height="56" rx="8"/><text class="th" x="340" y="784">App: semáforo por pixel</text><text class="ts" x="340" y="804">Dónde, cuándo y cuánto regar</text>
</svg>
