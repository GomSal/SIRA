[project]
name = "sira"
version = "0.1.0"
description = "SIRA: estado hídrico del arroz en Nataima. Fase 0: digitalización de la verdad de campo."
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "matplotlib", "pymupdf", "pyproj", "shapely"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
